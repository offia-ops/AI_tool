<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台新股票交易手續費計算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bar-transition { transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        /* 隱藏數字輸入框的上下箭頭 */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center py-8 px-4 gap-6">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden shrink-0">
        <div class="bg-slate-800 p-6 text-white">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                台新股票交易手續費計算器
            </h1>
            <p class="text-slate-300 text-sm mt-1">即時計算台股買賣的手續費低消與交易稅陷阱</p>
        </div>

        <div class="p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Left Column: Inputs -->
            <div class="space-y-6">
                <!-- Trade Value Slider & Input -->
                <div>
                    <div class="flex justify-between items-end mb-2">
                        <label class="text-sm font-semibold text-slate-700" for="tradeInput">成交金額 (TWD)</label>
                        <div class="relative">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-blue-500 font-bold">$</span>
                            <input type="number" id="tradeInput" min="1" value="10000" class="w-36 text-right text-lg font-bold text-blue-600 bg-blue-50 pl-6 pr-3 py-1 rounded-lg border-2 border-transparent focus:outline-none focus:border-blue-400 transition-colors">
                        </div>
                    </div>
                    <input type="range" id="tradeValue" min="100" max="1000000" step="100" value="10000" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600 mt-2">
                    <div class="flex justify-between text-xs text-slate-400 mt-2 font-medium">
                        <span>$100</span>
                        <span>$1,000,000+</span>
                    </div>
                </div>

                <!-- Action Toggle -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">交易動作</label>
                    <div class="flex bg-slate-100 p-1 rounded-xl">
                        <button id="btnBuy" class="flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 hover:text-slate-800 transition-all focus:outline-none bg-transparent">買進</button>
                        <button id="btnSell" class="flex-1 py-2 text-sm font-bold rounded-lg bg-white shadow text-blue-700 transition-all focus:outline-none">賣出</button>
                    </div>
                    <div id="actionHint" class="mt-3 text-xs text-slate-500 bg-slate-50 p-3 rounded-lg border border-slate-100">
                    <span class="font-semibold text-slate-700">【賣出規則】</span>需收取手續費 (0.1425%)，以及額外的證券交易稅 (0.3%)。
                </div>
            </div>

            <div class="pt-2">
                <button id="btnAddTrade" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-sm transition-colors flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    加入計算清單
                </button>
            </div>
        </div>

        <!-- Right Column: Outputs -->
        <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 flex flex-col justify-between">
                
                <!-- Main KPI Cards -->
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <div class="text-xs text-slate-500 mb-1 font-medium">總交易成本</div>
                        <div class="flex items-baseline gap-1">
                            <span id="totalFee" class="text-2xl font-black text-slate-800">20</span>
                            <span class="text-sm font-medium text-slate-500">TWD</span>
                        </div>
                    </div>
                    
                    <div id="impactCard" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm transition-colors duration-300">
                        <div id="impactTitle" class="text-xs text-slate-500 mb-1 font-medium">成本占總額比例</div>
                        <div class="flex items-baseline gap-1">
                            <span id="impactPct" class="text-2xl font-black text-slate-800">0.20</span>
                            <span id="impactUnit" class="text-sm font-bold text-slate-500">%</span>
                        </div>
                    </div>
                </div>

                <!-- Cost Breakdown Chart -->
                <div class="space-y-4">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">成本結構拆解</h3>
                    
                    <!-- Broker Fee Row -->
                    <div>
                        <div class="flex justify-between text-sm mb-1">
                            <span class="text-slate-600 font-medium">券商手續費 <span class="text-slate-400 text-xs">(0.1425% / 低消 20)</span></span>
                            <span id="brokerFeeText" class="font-bold text-slate-800">20 TWD</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                            <div id="brokerBar" class="bg-blue-500 h-2.5 rounded-full bar-transition" style="width: 100%"></div>
                        </div>
                    </div>

                    <!-- Tax Fee Row -->
                    <div>
                        <div class="flex justify-between text-sm mb-1">
                            <span class="text-slate-600 font-medium">證券交易稅 <span class="text-slate-400 text-xs">(0.3% 賣出收取)</span></span>
                            <span id="taxFeeText" class="font-bold text-slate-800">0 TWD</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                            <div id="taxBar" class="bg-rose-500 h-2.5 rounded-full bar-transition" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<div id="listSection" class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden hidden shrink-0 mb-8">
    <div class="bg-slate-50 border-b border-slate-200 p-4 md:p-6 flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
            多筆交易計算清單
        </h2>
        <button id="btnClearList" class="text-sm text-rose-500 hover:text-rose-700 font-medium transition-colors border border-rose-200 hover:bg-rose-50 rounded-lg px-3 py-1">清空清單</button>
    </div>
    <div class="p-4 md:p-6 overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[500px]">
            <thead>
                <tr class="text-xs text-slate-500 border-b border-slate-200">
                    <th class="pb-3 px-2 font-semibold w-16">動作</th>
                    <th class="pb-3 px-2 font-semibold text-right">成交金額</th>
                    <th class="pb-3 px-2 font-semibold text-right">手續費</th>
                    <th class="pb-3 px-2 font-semibold text-right">交易稅</th>
                    <th class="pb-3 px-2 font-semibold text-right">總成本</th>
                    <th class="pb-3 px-2 font-semibold text-center w-12">移除</th>
                </tr>
            </thead>
            <tbody id="tradeListBody" class="text-sm">
                <!-- Dynamic Rows -->
            </tbody>
            <tfoot>
                <tr class="bg-slate-50 font-bold text-slate-800 text-sm border-t-2 border-slate-200">
                    <td class="pt-4 pb-2 px-2 rounded-l-lg">總計</td>
                    <td id="sumAmount" class="pt-4 pb-2 px-2 text-right">0</td>
                    <td id="sumBroker" class="pt-4 pb-2 px-2 text-right">0</td>
                    <td id="sumTax" class="pt-4 pb-2 px-2 text-right">0</td>
                    <td id="sumTotal" class="pt-4 pb-2 px-2 text-right text-rose-600">0</td>
                    <td class="pt-4 pb-2 px-2 rounded-r-lg"></td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<script>
    try {
        // State Variables
        let state = {
            tradeValue: 10000,
            isSell: true,
            trades: [],
            nextId: 1
        };

        // DOM Elements
            const els = {
                tradeValue: document.getElementById('tradeValue'),
                tradeInput: document.getElementById('tradeInput'),
                btnBuy: document.getElementById('btnBuy'),
                btnSell: document.getElementById('btnSell'),
                actionHint: document.getElementById('actionHint'),
                totalFee: document.getElementById('totalFee'),
                impactCard: document.getElementById('impactCard'),
                impactTitle: document.getElementById('impactTitle'),
                impactPct: document.getElementById('impactPct'),
                impactUnit: document.getElementById('impactUnit'),
            brokerFeeText: document.getElementById('brokerFeeText'),
            taxFeeText: document.getElementById('taxFeeText'),
            brokerBar: document.getElementById('brokerBar'),
            taxBar: document.getElementById('taxBar'),
            
            btnAddTrade: document.getElementById('btnAddTrade'),
            listSection: document.getElementById('listSection'),
            tradeListBody: document.getElementById('tradeListBody'),
            btnClearList: document.getElementById('btnClearList'),
            sumAmount: document.getElementById('sumAmount'),
            sumBroker: document.getElementById('sumBroker'),
            sumTax: document.getElementById('sumTax'),
            sumTotal: document.getElementById('sumTotal')
        };

        // Calculate & Render Loop
            function updateCalculations() {
                // 1. Calculate Base Values
                const brokerFee = Math.max(20, Math.floor(state.tradeValue * 0.001425));
                const taxFee = state.isSell ? Math.floor(state.tradeValue * 0.003) : 0;
                const totalFee = brokerFee + taxFee;
                const impact = state.tradeValue > 0 ? (totalFee / state.tradeValue) * 100 : 0;

                // 2. Update Text Displays
                // 確保使用者在輸入框打字時，不會被程式覆蓋掉輸入狀態
                if (document.activeElement !== els.tradeInput) {
                    els.tradeInput.value = state.tradeValue;
                }
                els.tradeValue.value = state.tradeValue;
                
                els.totalFee.textContent = totalFee.toLocaleString();
                els.impactPct.textContent = impact.toFixed(2);
                els.brokerFeeText.textContent = brokerFee.toLocaleString() + ' TWD';
                els.taxFeeText.textContent = taxFee.toLocaleString() + ' TWD';

                // 3. Warning Highlighting (>1% friction cost is usually inefficient)
                if (impact >= 1.0) {
                    els.impactCard.className = 'bg-rose-50 p-4 rounded-xl border border-rose-200 shadow-sm transition-colors duration-300';
                    els.impactTitle.className = 'text-xs text-rose-600 mb-1 font-bold';
                    els.impactTitle.textContent = '小額交易不划算 (>1%)';
                    els.impactPct.className = 'text-2xl font-black text-rose-700';
                    els.impactUnit.className = 'text-sm font-bold text-rose-600';
                } else {
                    els.impactCard.className = 'bg-emerald-50 p-4 rounded-xl border border-emerald-200 shadow-sm transition-colors duration-300';
                    els.impactTitle.className = 'text-xs text-emerald-600 mb-1 font-bold';
                    els.impactTitle.textContent = '成本占總額比例 (合理)';
                    els.impactPct.className = 'text-2xl font-black text-emerald-700';
                    els.impactUnit.className = 'text-sm font-bold text-emerald-600';
                }

                // 4. Update Bar Charts (Relative sizing)
                const maxFeeScale = Math.max(totalFee, 50); // Minimum scale to avoid division by zero
                const brokerPct = (brokerFee / maxFeeScale) * 100;
                const taxPct = (taxFee / maxFeeScale) * 100;

                els.brokerBar.style.width = brokerPct + '%';
            els.taxBar.style.width = taxPct + '%';
        }

        function renderTradeList() {
            if (state.trades.length === 0) {
                els.listSection.classList.add('hidden');
                return;
            }
            els.listSection.classList.remove('hidden');
            
            els.tradeListBody.innerHTML = '';
            let tAmount = 0, tBroker = 0, tTax = 0, tTotal = 0;

            state.trades.forEach(trade => {
                tAmount += trade.amount;
                tBroker += trade.brokerFee;
                tTax += trade.taxFee;
                tTotal += trade.totalFee;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-100 transition-colors border-b border-slate-100 last:border-none";
                
                const actionBadge = trade.isSell 
                    ? '<span class="bg-rose-100 text-rose-700 py-1 px-2 rounded text-xs font-bold">賣出</span>'
                    : '<span class="bg-blue-100 text-blue-700 py-1 px-2 rounded text-xs font-bold">買進</span>';

                tr.innerHTML = `
                    <td class="py-3 px-2">${actionBadge}</td>
                    <td class="py-3 px-2 text-right font-medium text-slate-700">${trade.amount.toLocaleString()}</td>
                    <td class="py-3 px-2 text-right text-slate-500">${trade.brokerFee.toLocaleString()}</td>
                    <td class="py-3 px-2 text-right text-slate-500">${trade.taxFee.toLocaleString()}</td>
                    <td class="py-3 px-2 text-right font-bold text-rose-600">${trade.totalFee.toLocaleString()}</td>
                    <td class="py-3 px-2 text-center">
                        <button onclick="removeTrade(${trade.id})" class="text-slate-400 hover:text-rose-500 transition-colors p-1 rounded-md hover:bg-rose-50" title="移除">
                            <svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </td>
                `;
                els.tradeListBody.appendChild(tr);
            });

            els.sumAmount.textContent = tAmount.toLocaleString();
            els.sumBroker.textContent = tBroker.toLocaleString();
            els.sumTax.textContent = tTax.toLocaleString();
            els.sumTotal.textContent = tTotal.toLocaleString();
        }

        window.removeTrade = function(id) {
            state.trades = state.trades.filter(t => t.id !== id);
            renderTradeList();
        };

        // Event Listeners
        els.btnAddTrade.addEventListener('click', () => {
            const brokerFee = Math.max(20, Math.floor(state.tradeValue * 0.001425));
            const taxFee = state.isSell ? Math.floor(state.tradeValue * 0.003) : 0;
            
            state.trades.push({
                id: state.nextId++,
                isSell: state.isSell,
                amount: state.tradeValue,
                brokerFee: brokerFee,
                taxFee: taxFee,
                totalFee: brokerFee + taxFee
            });
            renderTradeList();
        });

        els.btnClearList.addEventListener('click', () => {
            state.trades = [];
            renderTradeList();
        });

        els.tradeValue.addEventListener('input', (e) => {
                state.tradeValue = parseInt(e.target.value) || 0;
                updateCalculations();
            });

            // 監聽自行輸入數字的事件
            els.tradeInput.addEventListener('input', (e) => {
                state.tradeValue = parseInt(e.target.value) || 0;
                updateCalculations();
            });

            els.btnBuy.addEventListener('click', () => {
                state.isSell = false;
                
                // Style Active/Inactive
                els.btnBuy.className = 'flex-1 py-2 text-sm font-bold rounded-lg bg-white shadow text-blue-700 transition-all focus:outline-none';
                els.btnSell.className = 'flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 hover:text-slate-800 transition-all focus:outline-none bg-transparent';
                
                // Update Hint
                els.actionHint.innerHTML = '<span class="font-semibold text-slate-700">【買進規則】</span>僅收取手續費 (0.1425%)，未滿 20 元以 20 元計收。';
                
                updateCalculations();
            });

            els.btnSell.addEventListener('click', () => {
                state.isSell = true;
                
                // Style Active/Inactive
                els.btnSell.className = 'flex-1 py-2 text-sm font-bold rounded-lg bg-white shadow text-blue-700 transition-all focus:outline-none';
                els.btnBuy.className = 'flex-1 py-2 text-sm font-medium rounded-lg text-slate-500 hover:text-slate-800 transition-all focus:outline-none bg-transparent';
                
                // Update Hint
                els.actionHint.innerHTML = '<span class="font-semibold text-slate-700">【賣出規則】</span>需收取手續費 (0.1425%)，以及額外的證券交易稅 (0.3%)。';
                
                updateCalculations();
            });

            // Initial render
            updateCalculations();

        } catch (error) {
            console.error("Initialization Error: ", error);
            document.body.innerHTML = `<div class="p-8 text-red-500 font-bold bg-white rounded shadow-lg m-4">發生錯誤: ${error.message}</div>`;
        }
    </script>
</body>
</html>
